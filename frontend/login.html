
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 4px 15px #00000020;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Login</h2>
        <p>Login to manage your tasks</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>
        </form>

        <p id="message" role="status"></p>

        <p style="text-align:center;">
            Don't have an account?
            <a href="/register.html">Register</a>
        </p>
    </div>

    <script>
        const API_URL =
            "https://task-management-app-ncyu.onrender.com";

        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();
            const password =
                document.getElementById("password").value;

            button.disabled = true;
            button.textContent = "Logging in...";
            message.textContent = "";

            try {
                const response = await fetch(
                    `${API_URL}/api/auth/login`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    // Save token only if backend returns one.
                    if (data.token) {
                        localStorage.setItem("token", data.token);
                    }

                    message.style.color = "green";
                    message.textContent =
                        data.message || "Login successful!";

                    // Open dashboard after successful login.
                    setTimeout(function () {
                        window.location.href = "/dashboard.html";
                    }, 700);

                } else {
                    message.style.color = "red";
                    message.textContent =
                        data.message || "Login failed. Check your details.";
                }

            } catch (error) {
                console.error("Login error:", error);
                message.style.color = "red";
                message.textContent =
                    "Cannot connect to server. Please try again.";
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });
    </script>
</body>
</html>
